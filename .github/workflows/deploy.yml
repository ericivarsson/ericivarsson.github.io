# Publicerar redan byggda filer till GitHub Pages.
# Lufven byggs i det privata repot ericivarsson/lufven-purrfect-day
# och pushas hit som mappen lufven-purrfect-day/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          if [ -d lufven-purrfect-day ]; then
            mkdir -p site/lufven-purrfect-day
            cp -a lufven-purrfect-day/. site/lufven-purrfect-day/
          fi
          if [ -d super-lufven ]; then
            mkdir -p site/super-lufven
            cp -a super-lufven/. site/super-lufven/
          fi
          touch site/.nojekyll
          find site -name .DS_Store -delete
          rm -rf site/.git site/.github site/lufven-purrfect-day/.git site/super-lufven/.git

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
